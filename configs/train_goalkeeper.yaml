# PPO baseline for Phase 1 (goalkeeper).
policy: asymmetric      # asymmetric: critic also sees privileged sim state | mlp: both see tracked obs only
total_timesteps: 1000000
n_envs: 8
vec_env: subproc        # subproc | dummy
seeds: [0, 1, 2]
net_arch: [64, 64]
checkpoint_freq: 250000 # In total env steps
ppo:
  learning_rate: 3.0e-4
  n_steps: 512          # Per env, per rollout
  batch_size: 256
  n_epochs: 10
  gamma: 0.98           # Episodes are ~12 control steps
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
