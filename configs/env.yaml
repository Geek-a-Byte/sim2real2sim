# Simulation and task settings. These are design choices, not physical facts.

sim:
  physics_dt_s: 0.001        # Fast 2D sim step. 5 m/s puck moves 5 mm per step (< puck radius)
  control_hz: 30.0           # TODO: confirm achievable SO-101 bus rate on Jetson

tracker:
  # Constant-velocity Kalman filter, white-noise acceleration model.
  # Tuning value, not a physical value. Larger = trusts measurements more.
  # 2.0 ~ friction deceleration mu*g between bounces. Steady state at 60 Hz,
  # 3 mm noise: vel std 0.056 m/s, pos std 5 mm after 50 ms latency extrapolation.
  accel_noise_std_m_s2: 2.0
  init_vel_std_m_s: 2.0

goalkeeper:
  # Phase 1 task settings (design choices).
  pan_range_deg: 20.0        # Paddle travel +-20 deg keeps the paddle inside the board
  paddle_standoff_m: 0.005   # Gap between the divider face and the paddle face at pan = 0
  paddle_start: uniform      # uniform: random pan in range (arm busy elsewhere) | center
  speed_range_m_s: [0.8, 3.0]  # TODO: measure real shot speeds. ~0.65 m/s is the minimum that reaches the gate
  prelaunch_s: [0.1, 0.5]    # Puck rests at the opponent band line before launch
  aim_spread_m: 0.006        # Aim point x ~ U(-spread, spread) on the gate line. Gate passes ~+-3 mm
  threats_only: true         # Resample shots until they would score with no paddle
  max_threat_tries: 50
  max_episode_s: 2.0
  smoothness_weight: 0.01    # Reward penalty per unit change of the action
  randomize: true            # Sample domain randomization (block below) every episode

opponent:
  reload_time_mu_s: 2.0      # TODO: measure from human play
  reload_time_std_s: 0.5     # TODO: measure from human play
  aim_time_s: 0.5            # TODO: measure from human play
  tell_strength: 0.8         # Experiment variable in [0, 1]
  shot_speed_mu: 3.0         # TODO: measure from human play

scoring:
  # TODO: scoring rules. Align with the real game rules before Phase 3 results.
  points_to_win: 5
  max_episode_time_s: 60.0

# Domain randomization. Keys are dotted paths into the merged config.
#   scale: [lo, hi]  -> value * U(lo, hi)
#   range: [lo, hi]  -> U(lo, hi)
#   clip:  [lo, hi]  -> optional bounds after sampling
# TODO: set ranges from sysid uncertainty once real logs exist.
randomization:
  enabled: true
  params:
    puck.friction_kinetic: {scale: [0.7, 1.3]}
    puck.restitution: {scale: [0.9, 1.1], clip: [0.0, 1.0]}
    board.restitution: {scale: [0.85, 1.1], clip: [0.0, 1.0]}
    board.gate_width_m: {range: [0.0307, 0.0330]}  # 1.21-1.30 in, until measured
    board.paddle_restitution: {scale: [0.8, 1.2], clip: [0.0, 1.0]}
    band.stiffness_k_n_m: {scale: [0.8, 1.2]}
    band.hysteresis_loss_factor: {scale: [0.7, 1.3], clip: [0.0, 0.9]}
    arm.deflection_compliance_m_per_n: {scale: [0.5, 1.5]}
    camera.latency_s: {scale: [0.7, 1.5]}
    camera.noise_std_m: {scale: [0.5, 2.0]}
    camera.dropout_prob: {scale: [0.0, 2.5], clip: [0.0, 0.5]}
    servo.command_latency_s: {scale: [0.7, 1.5]}
    servo.lag_tau_s: {scale: [0.7, 1.3]}
    servo.max_rate_deg_s: {scale: [0.8, 1.05]}
