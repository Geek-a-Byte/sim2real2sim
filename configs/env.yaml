# Simulation and task settings. These are design choices, not physical facts.

sim:
  mujoco_timestep_s: 0.0005  # MuJoCo match step (restitution error < 3%)
  mujoco_contact_time_s: 0.004  # Puck contact half-period; ~3 mm penetration at 3 m/s

opponent:
  # Human opponent, cycle: reload -> place on band -> pull back -> hold -> release.
  # The hand covers the loaded puck from the overhead camera; the camera sees the hand.
  reload_time_mu_s: 0.6      # TODO: measure from human play (time to pick the next puck)
  reload_time_std_s: 0.2     # TODO: measure from human play
  place_time_s: 0.2          # TODO: measure (hand moves the puck to the band)
  pull_time_s: 0.2           # TODO: measure (hand pulls the band back)
  hold_time_range_s: [0.05, 0.3]  # TODO: measure (pause between pull and release)
  # Cycle ~1.2 s: a human shoots about one puck per second.
  shot_speed_range_m_s: [1.0, 3.0]  # TODO: measure from human play
  threat_prob: 0.5           # TODO: measure. Fraction of shots aimed through the gate
  tell_strength: 0.8         # Experiment variable in [0, 1]: how well the hand x predicts the launch x
  hand_noise_m: 0.005        # Camera noise on the tracked hand position
  max_pull_m: 0.03           # Hand pull-back for the fastest shot (pull ~ speed)

match:
  # Event-level match (envs/match_env.py). Times are placeholders until measured on the robot.
  pucks_per_side: 5          # TODO: confirm (standard sling puck: 5 per player)
  max_time_s: 60.0
  decision_dt_s: 0.1         # High-level decision period
  sim_dt_s: 0.01             # Event-sim step
  move_gate_to_band_s: 0.6   # TODO: measure arm transition time
  move_band_to_gate_s: 0.6   # TODO: measure arm transition time
  fetch_time_s: 1.0          # TODO: measure (bring the next puck from the agent half to the band)
  sling_core_s: 0.9          # TODO: measure (slide, pull, look, correct, release once at the band)
  sling_flight_s: 0.15       # Own puck: release to gate
  puck_track_noise_m: 0.002  # Tracked incoming puck position noise
  puck_track_vel_noise_m_s: 0.05
  observe_hand: true         # false = ablation without hand kinematics
  # Block primitive (primitives/block.py): save_prob * Phi((time to cover - cover_time) / std)
  block_save_prob: 1.0       # TODO: measure (closed gripper in the gate; gate 3.4 cm, puck 2.54 cm)
  cover_time_s: 0.05         # TODO: measure (arm back at the gate -> gate covered)
  cover_time_std_s: 0.02     # TODO: measure (spread of the cover time)
  sling_success_prob: 0.95   # TODO: measure (fraction of robot slings that go through the gate)

scoring:
  # TODO: scoring rules. Placeholder = standard sling puck: the first player with
  # no pucks on their side wins. Align with the real game rules before match results.
  win_rule: empty_side       # empty_side | time_only
  reward_puck_sent: 1.0      # Agent puck reaches the opponent half
  reward_puck_received: -1.0 # Opponent puck reaches the agent half
  reward_win: 5.0
  reward_loss: -5.0
