# Simulation and task settings. These are design choices, not physical facts.

sim:
  physics_dt_s: 0.001        # Fast 2D sim step. 5 m/s puck moves 5 mm per step (< puck radius)
  control_hz: 30.0           # TODO: confirm achievable SO-101 bus rate on Jetson
  mujoco_timestep_s: 0.0005  # MuJoCo backend: 2 steps per physics_dt (restitution error < 3%)
  mujoco_contact_time_s: 0.004  # Wall/paddle contact half-period; ~3 mm penetration at 3 m/s

tracker:
  # Constant-velocity Kalman filter, white-noise acceleration model.
  # Tuning value, not a physical value. Larger = trusts measurements more.
  # 2.0 ~ friction deceleration mu*g between bounces. Steady state at 60 Hz,
  # 3 mm noise: vel std 0.056 m/s, pos std 5 mm after 50 ms latency extrapolation.
  accel_noise_std_m_s2: 2.0
  init_vel_std_m_s: 2.0

goalkeeper:
  # Phase 1 task settings (design choices).
  pan_range_deg: 20.0        # Paddle travel +-20 deg keeps the paddle inside the board
  paddle_standoff_m: 0.005   # Gap between the divider face and the paddle face at pan = 0
  paddle_start: uniform      # uniform: random pan in range (arm busy elsewhere) | center
  speed_range_m_s: [0.8, 3.0]  # TODO: measure real shot speeds. ~0.65 m/s is the minimum that reaches the gate
  prelaunch_s: [0.1, 0.5]    # Puck rests at the opponent band line before launch
  paddle_locked_until_launch: true  # Recovery task: arm busy (e.g. slinging) until the launch
  release_delay_s: [0.0, 0.0]  # Paddle frees this long after the launch. Phase 3 sweeps it
  aim_spread_m: 0.006        # Aim point x ~ U(-spread, spread) on the gate line. Gate passes ~+-3 mm
  threats_only: true         # Resample shots until they would score with no paddle
  max_threat_tries: 50
  max_episode_s: 2.0
  smoothness_weight: 0.01    # Reward penalty per unit change of the action
  randomize: true            # Sample domain randomization (block below) every episode

sling:
  # Phase 2 task settings (design choices).
  puck_x_range_m: [-0.06, 0.06]  # Where the puck rests against the band before the shot
  max_angle_deg: 35.0        # Pull direction range (0 = straight toward the gate)
  correction_step: true      # Second step: see the realized pull, then correct before release
  correction_slide_m: 0.003  # Max lateral correction while the puck is pulled
  correction_angle_deg: 3.0  # Max correction per axis
  correction_pull_frac: 0.3  # Max pull correction, fraction of max_pull
  observe_window_s: 0.3      # Camera watches the still puck this long before each decision
  place_noise_m: 0.001       # TODO: measure slide placement repeatability
  angle_noise_deg: 0.3       # TODO: measure arm pointing repeatability
  correction_noise_scale: 0.5  # Execution noise of the correction, relative to the first pull
  pull_noise_m: 0.0005       # TODO: measure arm pull repeatability
  release_angle_noise_deg: 0.5  # TODO: measure slip-release direction scatter
  max_flight_s: 2.0
  shaping_weight: 0.3        # Reward += weight * exp(-(gate miss / scale)^2); success gives +1
  shaping_scale_m: 0.01

opponent:
  # Human opponent, cycle: reload -> place on band -> pull back -> hold -> release.
  # The hand covers the loaded puck from the overhead camera; the camera sees the hand.
  reload_time_mu_s: 0.6      # TODO: measure from human play (time to pick the next puck)
  reload_time_std_s: 0.2     # TODO: measure from human play
  place_time_s: 0.2          # TODO: measure (hand moves the puck to the band)
  pull_time_s: 0.2           # TODO: measure (hand pulls the band back)
  hold_time_range_s: [0.05, 0.3]  # TODO: measure (pause between pull and release)
  # Cycle ~1.2 s: a human shoots about one puck per second, faster than the robot sling (~0.9-1.5 s).
  shot_speed_range_m_s: [1.0, 3.0]  # TODO: measure from human play
  threat_prob: 0.5           # TODO: measure. Fraction of shots aimed through the gate
  tell_strength: 0.8         # Experiment variable in [0, 1]: how well the hand x predicts the launch x
  hand_noise_m: 0.005        # Camera noise on the tracked hand position
  max_pull_m: 0.03           # Hand pull-back for the fastest shot (pull ~ speed)

match:
  # Phase 3 (event-level match). Times are placeholders until measured on the robot.
  pucks_per_side: 5          # TODO: confirm (standard sling puck: 5 per player)
  max_time_s: 60.0
  decision_dt_s: 0.1         # High-level decision period
  sim_dt_s: 0.01             # Event-sim step
  move_gate_to_band_s: 0.6   # TODO: measure arm transition time
  move_band_to_gate_s: 0.6   # TODO: measure arm transition time
  fetch_time_s: 1.0          # TODO: measure (bring the next puck from the agent half to the band)
  sling_core_s: 0.9          # TODO: measure (slide, pull, look, correct, release once at the band)
  sling_flight_s: 0.15       # Own puck: release to gate
  settle_after_return_s: 0.15  # After reaching the pan-range edge, the paddle needs ~this to cover the gate
  puck_track_noise_m: 0.002  # Tracked incoming puck position noise
  puck_track_vel_noise_m_s: 0.05
  observe_hand: true         # false = ablation without hand kinematics
  block_table:               # Frozen block primitive outcome model, measured on the Phase 1 env
    policy: center           # center | path to a goalkeeper run dir
    speeds_m_s: [0.8, 3.0, 12]   # linspace(lo, hi, n)
    delays_s: [0.0, 0.3, 13]
    episodes_per_cell: 40
  sling_success_prob: 0.946  # Frozen sling primitive; from the Phase 2 eval (PPO, M3). Refresh after real tests

scoring:
  # TODO: scoring rules. Placeholder = standard sling puck: the first player with
  # no pucks on their side wins. Align with the real game rules before Phase 3 results.
  win_rule: empty_side       # empty_side | time_only
  reward_puck_sent: 1.0      # Agent puck reaches the opponent half
  reward_puck_received: -1.0 # Opponent puck reaches the agent half
  reward_win: 5.0
  reward_loss: -5.0

# Domain randomization. Keys are dotted paths into the merged config.
#   scale: [lo, hi]  -> value * U(lo, hi)
#   range: [lo, hi]  -> U(lo, hi)
#   clip:  [lo, hi]  -> optional bounds after sampling
# TODO: set ranges from sysid uncertainty once real logs exist.
randomization:
  enabled: true
  params:
    puck.friction_kinetic: {scale: [0.7, 1.3]}
    puck.restitution: {scale: [0.9, 1.1], clip: [0.0, 1.0]}
    board.restitution: {scale: [0.85, 1.1], clip: [0.0, 1.0]}
    board.gate_width_m: {range: [0.0307, 0.0330]}  # 1.21-1.30 in, until measured
    board.paddle_restitution: {scale: [0.8, 1.2], clip: [0.0, 1.0]}
    band.stiffness_k_n_m: {scale: [0.8, 1.2]}
    band.natural_length_m: {scale: [0.99, 1.01]}
    band.hysteresis_loss_factor: {scale: [0.7, 1.3], clip: [0.0, 0.9]}
    band.energy_transfer: {scale: [0.85, 1.15], clip: [0.05, 1.0]}
    arm.deflection_compliance_m_per_n: {scale: [0.5, 1.5]}
    camera.latency_s: {scale: [0.7, 1.5]}
    camera.noise_std_m: {scale: [0.5, 2.0]}
    camera.dropout_prob: {scale: [0.0, 2.5], clip: [0.0, 0.5]}
    servo.command_latency_s: {scale: [0.7, 1.5]}
    servo.lag_tau_s: {scale: [0.7, 1.3]}
    servo.max_rate_deg_s: {scale: [0.8, 1.05]}
