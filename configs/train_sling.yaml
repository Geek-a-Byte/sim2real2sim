# PPO for Phase 2 (targeted shot). Episodes are 2 steps (aim, correct).
policy: asymmetric      # asymmetric: critic also sees privileged sim state | mlp
total_timesteps: 400000
n_envs: 8
vec_env: subproc
seeds: [0, 1, 2]
net_arch: [64, 64]
checkpoint_freq: 100000
ppo:
  learning_rate: 3.0e-4
  n_steps: 256          # Per env, per rollout
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
