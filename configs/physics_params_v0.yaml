# Physics parameters, version 0: UNCALIBRATED.
# Calibrated values go in physics_params_v1.yaml, v2, ... Load by version with
# slingpuck.config.load_config(params_version="v0" | "latest").
#
# Reference board: moopok Fast Sling Puck, size M (Amazon B086KWXPTY).
# Provenance tags: [spec] = listing text, [image] = listing image (size S, assumed
# same for M), [derived] = computed from tagged values, [TODO] = must be measured
# or fitted. Every [TODO] value is also listed under `placeholders` below, so
# load_config(strict=True) refuses to run with it.
version: 0
calibrated: false

board:
  outer_length_m: 0.3658     # [spec] 14.4 in
  outer_width_m: 0.2159      # [spec] 8.5 in
  outer_height_m: 0.0249     # [spec] 0.98 in ("tabletop thickness 2.5 cm" = same value)
  board_mass_kg: 0.360       # [spec] 360 g; not used by sim (board is fixed)
  wall_thickness_m: 0.01524  # [image] 0.6 in frame width. TODO: measure on size M
  length_m: 0.3353           # [derived] inner play length = 14.4 - 2*0.6 in
  width_m: 0.1854            # [derived] inner play width = 8.5 - 2*0.6 in
  divider_thickness_m: 0.010 # TODO: measure center divider thickness
  wall_height_m: 0.015       # TODO: measure wall/divider height above the play surface (MuJoCo only)
  gate_width_m: 0.034        # [user] measured 3.4 cm (4.3 mm clearance per side for the 1 in puck)
  restitution: 0.85          # TODO: measure (puck on wood wall; MuJoCo uses it for all puck contacts)

puck:
  radius_m: 0.0127           # [user] 1 in diameter. TODO: confirm in mm (calipers)
  thickness_m: 0.0102        # [image] 0.4 in. TODO: confirm on size M
  mass_kg: 0.027             # [user] weighed 27 g. CHECK: gives density 5.2 g/cm^3 for a 1 x 0.4 in puck;
                             # wood is 0.5-0.75. 27 g / 6 = 4.5 g, so the scale may have held several pucks.
  friction_kinetic: 0.20     # TODO: measure (wood on wood)

band:
  # One band per side, stretched between pegs at the side walls, parallel to the
  # end wall. Pulling the puck back makes a V; the band tension pushes the puck
  # forward on release. The band is pre-stretched (natural length < anchor span);
  # the pre-tension gives most of the launch energy.
  # Tension law (loading): T(s) = k * s * (s / 0.01 m)^(exponent - 1), s = band
  # length - natural length. Unloading follows a lower curve that meets the
  # loading curve at both ends (closed hysteresis loop), and loses
  # hysteresis_loss_factor of the loading work.
  anchor_span_m: 0.1854      # [derived] = inner width; assumes pegs at the side walls. TODO: measure peg spacing
  band_offset_from_end_wall_m: 0.05 # TODO: measure (band line to agent end wall)
  natural_length_m: 0.150    # TODO: measure with a band bench test (sets the pre-tension, ~7 N here)
  stiffness_k_n_m: 200.0     # TODO: measure with a band bench test
  stiffness_exponent: 1.0    # TODO: measure (1 = linear; > 1 stiffens with stretch)
  hysteresis_loss_factor: 0.15 # TODO: measure with a band bench test (load/unload cycle)
  energy_transfer: 0.70      # TODO: measure from launch speeds (band mass, slip-release losses)

robot:
  # SO-101 mounting, in the board frame. The robot and the board stand on the same table.
  base_xy_m: [0.0, -0.2177]  # TODO: measure pan-axis position. Placeholder: 5 cm behind the agent end wall

camera:
  latency_s: 0.05            # TODO: measure (glass-to-tracker latency)

placeholders:
  - board.wall_thickness_m
  - board.divider_thickness_m
  - board.restitution
  - puck.radius_m
  - puck.thickness_m
  - puck.friction_kinetic
  - band.anchor_span_m
  - band.band_offset_from_end_wall_m
  - band.natural_length_m
  - band.stiffness_k_n_m
  - band.stiffness_exponent
  - band.hysteresis_loss_factor
  - band.energy_transfer
  - robot.base_xy_m
  - board.wall_height_m
  - camera.latency_s
